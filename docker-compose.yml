
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - SOCKET_URL=${SOCKET_URL}
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
    depends_on:
      - websocket
  
  websocket:
    build:
      context: ./websocket
    ports:
      - "3001:3001"